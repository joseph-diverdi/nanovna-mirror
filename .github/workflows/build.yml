# ------------------------------
# Builds the executables on GitHub's own macOS, Windows and Linux machines.
# Runs when a tag starting with "v" is pushed (e.g. v20261119.1), or by hand
# from the repository's Actions tab ("Run workflow").
# A tag push also publishes a GitHub Release with the three programs
# attached, downloadable by anyone who can see the repository.
# A run started by hand only leaves the builds as artifacts on the run's page.
# ------------------------------
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./build_macos.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install --upgrade -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NanoVNA-Mirror nanovna_mirror.py
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nanovna-mirror-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/nanovna-mirror

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/nanovna-mirror artifacts/nanovna-mirror-linux-x86_64
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
# ------------------------------
